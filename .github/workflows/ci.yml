name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks on ${{ matrix.os }} (Node 24)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21.0.12.1"
      - run: npm run test:node
        env:
          REQUIRE_LEMMINX: 1
      - run: npm run lint
      - run: npm run format:check
      - run: npm pack --dry-run

  integration:
    name: Real LemMinX and Lumine integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LUMINE_JASMINE_REPORTER: list
      LUMINE_TEST_PACKAGES: ide-client language-xml
      LEMMINX_VERSION: 0.31.2
      REQUIRE_LEMMINX: 1
    steps:
      - uses: actions/checkout@v7
        with:
          path: ide-xml
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/lumine
          path: lumine
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/ide-client
          path: ide-client
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/language-xml
          path: language-xml
      - uses: actions/setup-node@v7
        with:
          node-version-file: lumine/.nvmrc
          cache: npm
          cache-dependency-path: lumine/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21.0.12.1"
      - name: Install the exact checksum-verified LemMinX release
        run: |
          curl --fail --location --retry 3 --output lemminx.jar https://repo.eclipse.org/repository/lemminx-maven2-releases/org/eclipse/lemminx/org.eclipse.lemminx/0.31.2/org.eclipse.lemminx-0.31.2-uber.jar
          echo "f4fde164e785c635e5f86361dbf4b993bfe2c5f83fdb52891d058b7dfc9bcfc8  lemminx.jar" | sha256sum --check
          echo "LEMMINX_JAR=$GITHUB_WORKSPACE/lemminx.jar" >> "$GITHUB_ENV"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Use HTTPS for public Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install adapter dependencies
        working-directory: ide-xml
        run: npm ci --ignore-scripts
      - name: Install client dependencies
        working-directory: ide-client
        run: npm ci --ignore-scripts
      - name: Install editor dependencies
        working-directory: lumine
        run: |
          install() { npm ci --ignore-scripts; }
          install || install || install
      - name: Prepare Electron
        working-directory: lumine
        run: |
          node node_modules/electron/install.js
          npm run build
      - name: Link editor service packages
        run: |
          echo "LUMINE_HOME=$GITHUB_WORKSPACE/.test-home" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.test-home/packages"
          ln -s "$GITHUB_WORKSPACE/ide-client" "$GITHUB_WORKSPACE/.test-home/packages/ide-client"
          ln -s "$GITHUB_WORKSPACE/language-xml" "$GITHUB_WORKSPACE/.test-home/packages/language-xml"
      - name: Run Jasmine specs against the real editor and server
        working-directory: lumine
        timeout-minutes: 25
        run: xvfb-run --auto-servernum npm start -- --dev --test ../ide-xml/spec
